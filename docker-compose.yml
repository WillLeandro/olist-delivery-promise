services:
  postgres-dw:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DW_ADMIN_USER}
      POSTGRES_PASSWORD: ${DW_ADMIN_PASSWORD}
      POSTGRES_DB: ${DW_DATABASE}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-dw-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-dw-volume: